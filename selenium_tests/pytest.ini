[pytest]
# Qilly Regression Suite — pytest configuration
# Run from the selenium_tests/ directory:
#   pytest qilly_regression_suite_FIXED.py -v
#   run_tests.bat pytest

# ── Discovery ───────────────────────────────────────────────────────────────
testpaths        = .
python_files     = qilly_regression_suite_FIXED.py
python_classes   = Test*
python_functions = test_*

# ── Output ──────────────────────────────────────────────────────────────────
# Always generate an HTML report + short tracebacks.
# The timestamp in the filename prevents overwriting previous runs.
# Override on the command line:  pytest --html=myreport.html
addopts =
    -v
    --tb=short
    --html=reports/pytest_report.html
    --self-contained-html

# ── Logging ─────────────────────────────────────────────────────────────────
log_cli       = true
log_cli_level = WARNING

# ── Timeouts (requires pytest-timeout) ──────────────────────────────────────
# Uncomment after: pip install pytest-timeout
# timeout = 300
