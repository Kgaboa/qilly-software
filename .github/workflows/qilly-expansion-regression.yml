name: Qilly expansion regression
on:
  push:
    branches:
      - feature/qilly-expansion-sprint-01
  pull_request:
    branches:
      - uat-controlled-matching
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
