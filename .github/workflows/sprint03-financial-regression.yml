name: Sprint 03 financial regression
on:
  push:
    branches:
      - feature/qilly-expansion-sprint-03
  pull_request:
    paths:
      - 'src/utils/**'
      - 'src/app/components/BidDecisionWorkspace.tsx'
      - '.github/workflows/sprint03-financial-regression.yml'
  workflow_dispatch:
jobs:
  financial-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: BOQ entitlement, repricing and bid financial regression
        run: npx vitest run src/utils/boqEntitlements.test.ts src/utils/repricingScenario.test.ts src/utils/bidDecision.test.ts src/utils/bidFinancialIntegration.test.ts src/utils/approvedBidFinancials.test.ts src/utils/tenderRisk.test.ts src/utils/bidRiskGate.test.ts
      - name: Compile application
        run: npm run build
